version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./microservices/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - task-service

  auth-service:
    build: ./microservices/auth-service
    environment:
      - DATABASE_URL=postgresql://todo_user:todo_pass@auth-db:5432/authdb
    depends_on:
      auth-db:
        condition: service_healthy

  task-service:
    build: ./microservices/task-service
    environment:
      - DATABASE_URL=postgresql://todo_user:todo_pass@task-db:5432/taskdb
      - AUTH_SERVICE_URL=http://auth-service:5001
    depends_on:
      task-db:
        condition: service_healthy

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    volumes:
      - task_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_pgdata:
  task_pgdata:
